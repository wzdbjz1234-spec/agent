[project]
name = "dataharness"
version = "0.1.0"
description = "云端 LLM 驱动、本地持久化与隔离执行的数据分析 Agent Harness"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "pyarrow>=17",
    "pypdf>=5",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pydantic-ai>=2.29.0",
    "opensandbox>=0.1.15",
]

[project.scripts]
dataharness = "dataharness.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pyright>=1.1.350",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataharness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
